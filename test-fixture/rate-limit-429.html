<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>429 Too Many Requests</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #fff5f5; color: #991b1b; }
    .box { text-align: center; max-width: 480px; padding: 32px; background: white; border: 1px solid #fecaca; border-radius: 8px; }
    h1 { font-size: 24px; margin-top: 0; }
    p { color: #7f1d1d; font-size: 15px; line-height: 1.5; }
    code { background: #fee2e2; padding: 2px 6px; border-radius: 4px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>429 Too Many Requests</h1>
    <p>Rate limit exceeded. Too many requests have been received from your IP address.</p>
    <p>Please wait before retrying. Check the <code>Retry-After</code> HTTP header for recommended delay.</p>
  </div>
</body>
</html>
