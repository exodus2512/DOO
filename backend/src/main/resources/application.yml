spring:
  application:
    name: doo-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/doodb}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: ${DATABASE_DRIVER:org.postgresql.Driver}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${PORT:8082}
  compression:
    enabled: true

doo:
  ai:
    provider: ${AI_PROVIDER:gemini}
    gemini:
      api-key: ${GEMINI_API_KEY_1:}
      api-key-2: ${GEMINI_API_KEY_2:}
      api-key-3: ${GEMINI_API_KEY_3:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      max-retries: ${GEMINI_MAX_RETRIES:6}
      min-call-interval-ms: ${GEMINI_MIN_INTERVAL_MS:4000}
      max-rpm: ${GEMINI_MAX_RPM:10}
      key-cooldown-seconds: ${GEMINI_KEY_COOLDOWN_SECONDS:30}
    demo-mode: ${DEMO_MODE:false}
  browser-worker:
    url: ${BROWSER_WORKER_URL:http://localhost:3001}
    secret: ${BROWSER_WORKER_SECRET:dev-secret-change-in-production}
    timeout-seconds: ${BROWSER_WORKER_TIMEOUT:120}
  task:
    max-steps: ${TASK_MAX_STEPS:30}
    max-retries: ${TASK_MAX_RETRIES:3}
    max-ai-calls: ${TASK_MAX_AI_CALLS:40}
    execution-timeout-minutes: ${TASK_TIMEOUT_MINUTES:10}
    stale-running-minutes: ${TASK_STALE_MINUTES:15}

logging:
  level:
    com.doo: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"